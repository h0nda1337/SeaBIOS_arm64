name: Publish experimental SeaBIOS ARM64 v0.7 sources
on:
  push:
    branches:
      - experimental/arm64-shared-core-v0.7
    paths:
      - bootstrap/v07.patch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: experimental/arm64-shared-core-v0.7
          fetch-depth: 0
      - name: Verify and apply complete v0.6 to v0.7 patch
        shell: bash
        run: |
          set -euo pipefail
          echo '820ed61425d1bbe41a0b16a47f30c494225aae31cd35b8cdb190ce2ea43cd79a  bootstrap/v07.patch' | sha256sum -c -
          git apply --check bootstrap/v07.patch
          git apply bootstrap/v07.patch
          rm -rf bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(arm64): share SeaBIOS boot priorities and SHA-256 (v0.7)'
          git push origin HEAD:experimental/arm64-shared-core-v0.7
