name: Publish experimental ARM64 legacy MBR v0.6 sources
on:
  push:
    branches:
      - experimental/arm64-legacy-mbr-v0.6
    paths:
      - bootstrap/v0.6.ready
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.6 branch
        uses: actions/checkout@v4
        with:
          ref: experimental/arm64-legacy-mbr-v0.6
          fetch-depth: 0
      - name: Apply vetted v0.5 and v0.6 source patches (no build)
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/v0.5.patch
          test -f bootstrap/v0.6.patch
          echo "e58644940fb2a474dd97955d044f50b343b9314bd872433b19840c9cbf5c3dff  bootstrap/v0.5.patch" | sha256sum --check
          echo "02da23e4ef96c7b7d156b1d7e4aa91a6542794e63f610746b52d72a353fa3697  bootstrap/v0.6.patch" | sha256sum --check
          git apply --check bootstrap/v0.5.patch
          git apply bootstrap/v0.5.patch
          git apply --check bootstrap/v0.6.patch
          git apply bootstrap/v0.6.patch
          rm bootstrap/v0.5.patch bootstrap/v0.6.patch bootstrap/v0.6.ready
          rmdir bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(arm64): legacy MBR FAT32 stage2 and native ARM64 PE boot (v0.6-dev)'
          git push origin HEAD:experimental/arm64-legacy-mbr-v0.6
