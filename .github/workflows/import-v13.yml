name: Import SeaBIOS ARM64 v1.3 multi-disk patch
on:
  push:
    branches:
      - experimental/arm64-boot-disks-v1.3
    paths:
      - bootstrap/v13.patch.xz.b64
permissions:
  contents: write
jobs:
  import-v13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental/arm64-boot-disks-v1.3
          fetch-depth: 0
      - name: Verify and apply source changes (no fabricated build results)
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/v13.patch.xz.b64 || exit 0
          base64 --decode bootstrap/v13.patch.xz.b64 > /tmp/v13.patch.xz
          echo "e7a39f60a88d599b694e66538ac2716668daaf046bbb9e7960568ec1a78c8c72  /tmp/v13.patch.xz" | sha256sum -c -
          xz -dc /tmp/v13.patch.xz > /tmp/v13.patch
          git apply --check /tmp/v13.patch
          git apply /tmp/v13.patch
          rm bootstrap/v13.patch.xz.b64 .github/workflows/import-v13.yml
          rmdir bootstrap || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(arm64): multi-device legacy MBR and Linux boot selection (v1.3)'
          git push origin HEAD:experimental/arm64-boot-disks-v1.3
